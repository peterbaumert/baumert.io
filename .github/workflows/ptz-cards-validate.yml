name: Validate PTZ cards

on:
  pull_request:
    paths:
      - 'ptz-jobs/**'
      - 'scripts/build_ptz_cards.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python3 scripts/build_ptz_cards.py
