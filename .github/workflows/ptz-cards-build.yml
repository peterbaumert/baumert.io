name: Build PTZ cards

on:
  push:
    branches: [main]
    paths:
      - 'ptz-jobs/**'
      - 'scripts/build_ptz_cards.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python3 scripts/build_ptz_cards.py

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/ptz-cards.json
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate ptz-cards.json"
            git push
          fi
